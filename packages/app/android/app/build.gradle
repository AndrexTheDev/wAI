apply plugin: 'com.android.application'

android {
    namespace = "dev.andrexthedev.wai"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.andrexthedev.wai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Keep the packaged assets lean: wAI ships no maps, no fonts, no analytics.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        resourceConfigurations += ['de', 'en']
    }

    signingConfigs {
        // Release signing is configured through ~/.gradle/gradle.properties or
        // environment variables so no keystore ever lands in git.
        release {
            def storePath = System.getenv("WAI_KEYSTORE_PATH") ?: project.findProperty("waiKeystorePath")
            if (storePath && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword System.getenv("WAI_KEYSTORE_PASSWORD") ?: project.findProperty("waiKeystorePassword")
                keyAlias System.getenv("WAI_KEY_ALIAS") ?: project.findProperty("waiKeyAlias")
                keyPassword System.getenv("WAI_KEY_PASSWORD") ?: project.findProperty("waiKeyPassword")
            }
        }
        debug {
            // debug builds use the default debug keystore; nothing to configure
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    bundle {
        language {
            // Ship both languages in every APK/AAB (offline app, no split by locale).
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Firebase / FCM: wAI uses only local notifications, so there is deliberately
// no google-services plugin here. Nothing about the app requires Google services.

