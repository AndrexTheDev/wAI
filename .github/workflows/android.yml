name: Android build

on:
  # Allows triggering the workflow manually from the Actions tab.
  push:
    # Build on main and on any work branch so the pipeline is testable before merge.
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    paths:
      - 'packages/app/**'
      - 'packages/shared/**'
      - 'tools/build-android.sh'
      - 'tools/ci-signing.sh'
      - 'tools/check-release-safety.mjs'
      - 'tools/release-safety.mjs'
      - 'tools/test-release-safety.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the artifacts'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: APK · AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Uses the Android SDK that ships with the GitHub-hosted Ubuntu image and
      # only installs what is missing. No third-party action, no custom download,
      # so the pipeline cannot break because an action or mirror disappears.
      - name: Prepare Android SDK 36
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "using SDK root: $SDK"
          ls -1 "$SDK" || true

          # sdkmanager lives in cmdline-tools/<version>/bin, so search deep enough
          # and fall back to whatever is already on PATH.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found; cannot install platform 36"
            find "$SDK" -maxdepth 3 -type d | head -30
            exit 1
          fi
          chmod +x "$SDKMANAGER" || true
          echo "sdkmanager: $SDKMANAGER"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          echo "--- installed packages ---"
          "$SDKMANAGER" --list_installed | sed -n '1,25p' || true

          test -d "$SDK/platforms/android-36" || { echo "::error::platforms;android-36 missing"; exit 1; }
          test -x "$SDK/build-tools/36.0.0/aapt2" || ls "$SDK/build-tools" || true

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/36.0.0" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/app/android/**/*.gradle*', 'packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Android project checks (XML, icons, permissions, locales)
        run: npm run check:android

      - name: Configure signing
        env:
          WAI_KEYSTORE_BASE64: ${{ secrets.WAI_KEYSTORE_BASE64 }}
          WAI_KEYSTORE_PASSWORD: ${{ secrets.WAI_KEYSTORE_PASSWORD }}
          WAI_KEY_ALIAS: ${{ secrets.WAI_KEY_ALIAS }}
          WAI_KEY_PASSWORD: ${{ secrets.WAI_KEY_PASSWORD }}
        run: bash tools/ci-signing.sh

      # Normal PR/branch builds remain available as previews. Publishing through
      # either a v* tag or workflow_dispatch requires release signing and an
      # issuer not on the known-compromised list; launch approval remains manual.
      - name: Guard GitHub publication
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: node tools/check-release-safety.mjs --require-signing

      - name: Build release artifacts
        run: bash tools/build-android.sh

      - name: Read build metadata
        id: meta
        run: |
          echo "version=$(node -p "require('./packages/app/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "signed=$([[ '${{ env.WAI_SIGNING_MODE }}' == 'release' ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: wai-apk-${{ steps.meta.outputs.version }}
          path: |
            dist-release/*.apk
            dist-release/SHA256SUMS.txt
            dist-release/build-info.json
          retention-days: 90

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: wai-aab-${{ steps.meta.outputs.version }}
          path: dist-release/*.aab
          retention-days: 90

      - name: Upload build logs and mapping
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wai-build-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wai-build-logs/**
            packages/app/android/app/build/outputs/mapping/release/mapping.txt
            packages/app/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          # The publication guard blocks preview signing. Publication still
          # requires the manual approvals in docs/LAUNCH_CHECKLIST.md.
          name: wAI ${{ steps.meta.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## wAI ${{ steps.meta.outputs.version }}

            Offline environmental memory anchor for Android.

            | | |
            |---|---|
            | Package | `dev.andrexthedev.wai` |
            | Min Android | 8.0 (API 26) |
            | Target | API 36 |
            | Signed | ${{ steps.meta.outputs.signed == 'true' && 'release keystore' || 'preview key — for testing only, do not distribute' }} |
            | Commit | `${{ github.sha }}` |

            **Install:** download `wai-${{ steps.meta.outputs.version }}.apk`, allow
            installs from unknown sources for your file manager/browser, then open it.
            Verify the download with `SHA256SUMS.txt`.

            **Deutsch:** `wai-${{ steps.meta.outputs.version }}.apk` herunterladen,
            Installation aus unbekannten Quellen für den Browser/Dateimanager erlauben,
            Datei öffnen. Prüfsumme in `SHA256SUMS.txt`.

            Full notes: `docs/DELIVERY_SUMMARY.md` in the repository.
          files: |
            dist-release/*.apk
            dist-release/*.aab
            dist-release/SHA256SUMS.txt
            dist-release/build-info.json
