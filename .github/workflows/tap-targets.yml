# Sind Knöpfe groß genug für einen Daumen?
#
# `docs/DESIGN_SYSTEM.md` §4 verspricht „Tap targets ≥ 44×44 px". Gemessen war
# das nirgends wahr: `icon-btn` war 38×38, `chip` 43 hoch, die Segmente im
# Sprachschalter 42, der Schalter selbst 46×27. Die Zusage stand in der
# Dokumentation und nicht im Stylesheet.
#
# Deshalb ein eigener Lauf: die App in Chromium starten, die vier Reiter
# abklappern und für jedes bedienbare Element die *tatsächliche* Trefferfläche
# messen – mit `elementFromPoint` in halben Pixeln nach außen, nicht mit
# `getBoundingClientRect()`, weil ein 38-px-Knopf ja gerade eine unsichtbare
# 44-px-Fläche haben soll.
#
# Der Bericht geht nach `docs/TAP_TARGETS.md` zurück, damit er ohne
# Artefakt-Download lesbar ist.
name: Trefferflächen & Fokusringe

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Bericht in den Branch zurückschreiben'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'packages/app/src/styles/**'
      - 'packages/app/src/screens/**'
      - 'packages/app/src/ui/**'
      - 'tools/check-tap-targets.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tap-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure tap targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Build the app
        run: npm run build -w @wai/app

      - name: Serve the build
        run: |
          cd packages/app/dist
          python3 -m http.server 5174 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5174/ >/dev/null && break
            sleep 1
          done

      - name: Measure tap targets
        run: |
          set -o pipefail
          npm run check:tap -- --out docs/TAP_TARGETS.md 2>&1 | tee tap.log

      # Fokusringe gehören in denselben Lauf: beide brauchen dieselbe gebaute
      # App und denselben Browser, und beide sind Aussagen über das, was ein
      # Nutzer ohne Maus sieht.
      - name: Measure focus rings
        run: |
          set -o pipefail
          npm run check:focus -- --out docs/FOCUS_RINGS.md 2>&1 | tee focus.log

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Trefferflächen"
            echo '```'
            grep -E '✔|✖|Bauteile|Geprüft' tap.log | head -40 || tail -30 tap.log
            echo '```'
            echo ''
            echo "### Fokusringe"
            echo '```'
            grep -E '✔|✖|Stationen' focus.log | tail -20 || tail -20 focus.log
            echo '```'
          } > report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat report.md)" >/dev/null 2>&1 || echo 'Kommentar nicht möglich'

      - name: Commit report back
        if: ${{ always() && (github.event_name == 'push' || inputs.commit) }}
        run: |
          git config user.name 'wAI tap-target bot'
          git config user.email 'bot@andrexthedev.dev'
          git add docs/TAP_TARGETS.md docs/FOCUS_RINGS.md || true
          if git diff --cached --quiet; then
            echo 'keine Änderung'
          else
            git commit -m 'chore(docs): Berichte zu Trefferflächen und Fokusringen aktualisiert'
            git push
          fi
