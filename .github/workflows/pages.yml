name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'packages/app/**'
      - 'packages/shared/**'
      - 'packages/landing/**'
      - 'tools/build-all.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      # GitHub Pages must be switched on once in Settings → Pages → Source:
      # "GitHub Actions". Without that the deploy step would fail on every push,
      # so we detect the state and skip cleanly instead.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Enable Settings → Pages → Source: GitHub Actions to publish the site and the embedded app demo."
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build app + landing (single-origin demo)
        run: node tools/build-all.mjs

      - name: Add SPA fallback for deep links
        env:
          # Project pages live under /<repo>/ – derive the base from the repo name.
          SITE_BASE: /${{ github.event.repository.name }}/
        run: |
          # GitHub Pages serves 404.html for unknown paths; the landing router
          # reads location.pathname, so a copy of index.html makes /legal/* and
          # /a/ (shared anchors) work.
          #
          # The bundle uses relative asset URLs (base './'), which resolve
          # against the *requested* path – /wAI/a/#… would ask for
          # /wAI/a/assets/… and get this 404 page instead of the script. A single
          # <base href> therefore pins every relative URL to the site root, no
          # matter how deep the deep link is. The router reads the same tag and
          # strips the prefix, so paths stay intact.
          node -e '
            const fs = require("node:fs");
            const base = process.env.SITE_BASE.replace(/\/*$/, "/");
            const html = fs.readFileSync("packages/landing/dist/index.html", "utf8");
            const tag = `<base href="${base}" />`;
            if (!html.includes("<head>")) throw new Error("index.html has no <head>");
            fs.writeFileSync("packages/landing/dist/404.html", html.replace("<head>", `<head>\n    ${tag}`));
            console.log(`404.html fallback written with ${tag}`);
          '
          # The embedded app is a separate SPA under /app/.
          cp packages/landing/dist/app/index.html packages/landing/dist/app/404.html 2>/dev/null || true

      - name: Verify deep-link fallback
        run: |
          grep -q '<base href=' packages/landing/dist/404.html || { echo "::error::404.html lacks a <base href>; deep links would load no assets"; exit 1; }
          echo "deep-link fallback looks correct: $(grep -o '<base href="[^"]*"' packages/landing/dist/404.html)"

      # The steps below only run once Pages is enabled; until then the build is
      # still verified on every push and the job exits green with a notice.
      - name: Configure Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/landing/dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
